[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/tax-calculator"
  to = "/calculator.html"
  status = 301

[[redirects]]
  from = "/capital-gains-calculator"
  to = "/capital-gains.html"
  status = 301

[[redirects]]
  from = "/sip"
  to = "/sip-planner.html"
  status = 301

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 301
